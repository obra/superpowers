function select(t){selectedId=t.id;draw();inspect(t)}function draw(){const phases=all.filter(t=>t.kind==='phase'),p=all.find(t=>t.id===phaseId)||phases[0];if(!p)return;phaseId=p.id;const direct=kids(p.id);const modules=direct.filter(t=>t.kind!=='step');const mods=modules;if(!mods.some(t=>t.id===moduleId))moduleId=mods[0]?.id;const m=all.find(t=>t.id===moduleId),children=m?kids(m.id):[];const capabilities=children.filter(t=>t.kind==='capability'||t.kind==='module');const autoCapability=capabilities.length===1&&children.every(t=>t.kind==='capability'||t.kind==='module')?capabilities[0]:null;const expandedCapabilities=capabilities.flatMap(t=>kids(t.id));const shown=capabilities.length?(expandedCapabilities.concat(children.filter(t=>t.kind!=='capability'&&t.kind!=='module'))):children;if(autoCapability&&(!selectedId||!all.some(t=>t.id===selectedId))){selectedId=autoCapability.id;}$('road').replaceChildren();phases.forEach(t=>{const b=e('button',null,'milestone'+(t.id===phaseId?' selected':''));const top=e('div',null,'mtop');top.append(e('span',phaseMark(t,phases.indexOf(t)),'letter'),e('span',title(t)));b.append(top);const c=e('div',null,'counts');const concreteTasks=concrete(t.id);[['done','已完成'],['in_progress','进行中'],['todo','待完成']].forEach(([st,label])=>{const z=e('span');z.title=label+'执行任务：'+(st==='todo'?concreteTasks.filter(x=>x.status!=='done'&&x.status!=='in_progress').length:concreteTasks.filter(x=>x.status===st).length)+' 个执行任务';z.append(e('i',null,'dot '+st),e('div',st==='todo'?concreteTasks.filter(x=>x.status!=='done'&&x.status!=='in_progress').length:concreteTasks.filter(x=>x.status===st).length));c.append(z)});b.append(c);b.append(e('small',taskStatusSummary(t.id)+(historySummary(t.id)?' · 范围外 '+(taskLeaves(t.id).length-concrete(t.id).length)+' 个':''),'scope-summary')) ;b.append(e('small',timeText(t),'scope-summary road-time'));b.onclick=()=>{phaseId=t.id;moduleId=null;selectedId=t.id;draw();inspect(t)};b.scrollIntoView({block:'nearest',inline:phaseId===t.id?'center':'nearest'});$('road').append(b)});syncRoadNav(phases);$('phaseLetter').textContent=phaseMark(p,phases.indexOf(p));$('phaseTitle').textContent=title(p)+' · '+taskStatusSummary(p.id);$('crumb').textContent='项目 / '+title(p)+(m?' / '+title(m):'');$('viewSummary').textContent=m?'统计：'+taskStatusSummary(p.id)+' · '+taskRecordSummary(p.id)+' · 当前图形展示 '+mods.length+' 个模块节点和 '+shown.length+' 个展开子节点':'统计：'+taskStatusSummary(p.id)+' · '+taskRecordSummary(p.id)+' · 当前图形展示项目层级关系';$('graph').replaceChildren();const graph=$('graph');
const moduleNodes=mods.map(t=>node(t,28,0,29,'module',()=>{moduleId=t.id;selectedId=t.id;draw();inspect(t)}));
const childNodes=shown.map(t=>node(t,66,0,32,'cap',()=>select(t)));
const rootNode=node(p,2,0,20,'root',()=>select(p));
const gap=16,pad=24;
function columnHeight(nodes){return nodes.reduce((sum,n)=>sum+n.getBoundingClientRect().height,0)+Math.max(0,nodes.length-1)*gap}
const mh=columnHeight(moduleNodes),ch=columnHeight(childNodes);
const h=Math.max(580,mh+pad*2,ch+pad*2);graph.style.height=h+'px';
function place(nodes,start){let y=start;for(const n of nodes){n.style.top=y+'px';y+=n.getBoundingClientRect().height+gap}}
place(moduleNodes,(h-mh)/2);
const active=moduleNodes[mods.findIndex(t=>t.id===moduleId)];
function center(n){return parseFloat(n.style.top)+n.getBoundingClientRect().height/2}
const anchor=active?center(active):h/2;
place(childNodes,Math.max(pad,Math.min(h-pad-ch,anchor-ch/2)));
rootNode.style.top=(h/2-rootNode.getBoundingClientRect().height/2)+'px';
const svg=document.createElementNS(ns,'svg');svg.setAttribute('class','wires');svg.setAttribute('viewBox','0 0 1000 '+h);svg.setAttribute('preserveAspectRatio','none');graph.prepend(svg);
function wire(from,to){const x=(parseFloat(from.style.left)+parseFloat(from.style.width))*10,xx=parseFloat(to.style.left)*10,y=center(from),yy=center(to),mid=(x+xx)/2;const path=document.createElementNS(ns,'path');path.setAttribute('d',`M${x} ${y}H${mid}V${yy}H${xx}`);path.setAttribute('fill','none');path.setAttribute('stroke','#94a5c0');path.setAttribute('stroke-width','1.2');path.setAttribute('stroke-linejoin','round');svg.append(path)}
moduleNodes.forEach(n=>wire(rootNode,n));if(active)childNodes.forEach(n=>wire(active,n));
if(!shown.length){const empty=e('div','该节点暂无子项','empty');empty.style.cssText='position:absolute;left:66%;width:32%;top:'+Math.max(pad,anchor-30)+'px';graph.append(empty)}
}

function inspect(t){const root=$('inspector');root.replaceChildren();const head=e('div',null,'inspecthead');head.append(icon());const titlebox=e('div');titlebox.append(e('h2',title(t)),e('div',(t.kind==='capability'?'Tasks / 可验收能力':(t.kind==='phase'?'项目里程碑':'模块 / 实现记录')),'crumb'));head.append(titlebox);root.append(head);const inside=e('div',null,'inside'),st=e('div',null,'box');stages(t).forEach((v,i)=>{const row=e('div',null,'statusrow');row.append(e('strong',['前置验证','功能实现','集成验收'][i]),e('span',labels[v],'pill '+v));st.append(row)});inside.append(st);function box(h,text){const b=e('div',null,'box');b.append(e('h3',h));if(Array.isArray(text)){text.forEach(v=>{const p=e('p');const value=typeof v==='object'?JSON.stringify(v):String(v);if(h==='规格依据'&&value.startsWith('/')){const a=e('a',value);a.href='/open-marktext?path='+encodeURIComponent(value);a.target='_blank';a.rel='noopener';a.className='source-link';p.append(a)}else p.textContent=value;b.append(p)})}else b.append(e('p',text));inside.append(b)}box('范围与历史',[scopeLabel(t)+'（含祖先排除）','记录状态：'+(labels[t.status]||'待核实'),taskStatusSummary(t.id)+' · '+taskRecordSummary(t.id)+' · 层级关系节点 '+hierarchyStats(t.id).total+' 个（任务树 '+hierarchyStats(t.id).registered+' 个'+(hierarchyStats(t.id).planned?'，规划包 '+hierarchyStats(t.id).planned+' 个':'')+'）','原记录三阶段：'+['validation','implementation','acceptance'].map(k=>labels[t.stages?.[k]]||'待核实').join(' / ')]);const ti=timeInfo(t);box('时间进度',[ti.label+'：'+(ti.derived?'根据已登记子任务汇总':'任务记录本身'),'开始：'+shortFmt(ti.start),'结束：'+(ti.end?shortFmt(ti.end):(t.status==='done'?'未记录':'未结束') )]);box('规格依据',t.source||t.evidence||'尚未关联具体条款');const implementationItems=concrete(t.id);box('执行任务',implementationItems.map(x=>x.title+' · '+(labels[x.status]||'待核实')+' · '+scopeLabel(x)).length?implementationItems.map(x=>x.title+' · '+(labels[x.status]||'待核实')+' · '+scopeLabel(x)):'尚未关联独立任务');const plannedItems=planNodes(t.id);if(plannedItems.length)box('规划节点（尚未登记为执行任务）',plannedItems.map(x=>x.id+' · '+x.title));const historyItems=taskLeaves(t.id).filter(x=>scopeOf(x)!=='required');if(historyItems.length)box('范围外历史',historyItems.map(x=>x.title+' · '+(labels[x.status]||'待核实')+' · '+scopeLabel(x)));box('验收要点',t.criteria?.length?t.criteria:t.summary||'待 PM 补充');box('下一步',t.next_step||'待 PM 补充');root.append(inside)}
function syncRoadNav(phases){const sel=$('roadJump');sel.replaceChildren();if(!phases.length){sel.append(new Option('—',''));return}const labels={done:'已完成',in_progress:'进行中',todo:'待完成'};phases.forEach((t,i)=>{const c=taskStatusCounts(t.id);const label=(phaseMark(t,i))+' · '+title(t)+' ('+c.done+'/'+c.total+')';const o=new Option(label,t.id);sel.append(o)});sel.value=phaseId;const wrap=$('road').closest('.roadwrap');const el=$('road').querySelector('.milestone.selected');if(el)el.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});updateRoadButtons()}
function updateRoadButtons(){const road=$('road');const wrap=road.closest('.roadwrap');const canScroll=road.scrollWidth>wrap.clientWidth+8;$('roadPrev').disabled=!canScroll||road.scrollLeft<=2;$('roadNext').disabled=!canScroll||road.scrollLeft+wrap.clientWidth>=road.scrollWidth-2}
function scrollRoadByStep(dir){const road=$('road');const wrap=road.closest('.roadwrap');const milestones=[...road.querySelectorAll('.milestone')];const current=road.scrollLeft;const center=dir>0?current+wrap.clientWidth:current;let target=null;if(dir>0){for(const m of milestones){if(m.offsetLeft>center){target=m;break}}if(!target&&milestones.length)target=milestones.at(-1)}else{for(let i=milestones.length-1;i>=0;i--){if(milestones[i].offsetLeft<current-4){target=milestones[i];break}}if(!target&&milestones.length)target=milestones[0]}if(target)target.scrollIntoView({block:'nearest',inline:dir>0?'start':'end',behavior:'smooth'})}
function running(){const list=all.filter(t=>(t.kind==='task'||t.kind==='implementation_task')&&t.status==='in_progress');const requiredCount=list.filter(t=>scopeOf(t)==='required').length;$('runCount').textContent='当前执行任务 '+list.length+' 项 · 必需 '+requiredCount+' 项 · 范围外 '+(list.length-requiredCount)+' 项';$('running').replaceChildren();list.forEach(t=>{const row=e('tr');row.append(e('td',t.title),e('td',scopeLabel(t)),e('td',all.find(x=>x.id===t.parent_id)?.title||t.parent_id||'未关联'),e('td',t.owner||'未指定'),e('td',t.current_step||'进行中'),e('td',fmt(t.updated_at)));const td=e('td'),b=e('button','定位节点 ↗','locate');b.onclick=()=>{const path=[],seen=new Set();let n=t;while(n&&!seen.has(n.id)){path.push(n);seen.add(n.id);n=all.find(x=>x.id===n.parent_id)}const phase=path.find(x=>x.kind==='phase');if(phase){phaseId=phase.id;const phaseIndex=path.findIndex(x=>x.id===phase.id);const directChild=phaseIndex>0?path[phaseIndex-1]:null;moduleId=directChild?.id||null}selectedId=t.id;draw();inspect(t);const target=[...$('graph').querySelectorAll('.node')].find(x=>x.getAttribute('aria-label')===title(t));if(target)target.scrollIntoView({block:'center',inline:'nearest'});else $('graph').scrollIntoView({block:'center'})};td.append(b);row.append(td);$('running').append(row)});if(!list.length){const row=e('tr'),td=e('td','当前没有登记为进行中的执行任务；模块进展请查看上方。');td.colSpan=7;row.append(td);$('running').append(row)}}
let busy=false;async function refresh(){if(busy)return;busy=true;try{const r=await fetch('/api/progress',{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();board=d.board;all=board.tasks||[];$('projectTitle').textContent=board.project||'项目全景';$('sync').textContent='数据更新 '+fmt(board.updated_at);$('audit').textContent=(board.summary||'')+'\n\n'+(board.coverage_note||'')+'\n\n必需统计排除自身或任一祖先的可选外部、已取消、协调、required_denominator=false 或 status=canceled；未标注范围沿用旧口径。范围外历史单独计数（取消优先，其次可选、协调、其他排除），不计入必需阶段与未完成数。空必需集合显示不适用，不代表已完成。三阶段独立状态未登记时显示待核实；示例色彩不作为实际进度。';$('error').textContent='';draw();inspect(all.find(t=>t.id===selectedId)||all.find(t=>t.id===moduleId)||all[0]);running()}catch(err){$('error').textContent='无法读取最新项目数据，当前内容可能已过期。'}finally{busy=false}}$('roadPrev').onclick=()=>scrollRoadByStep(-1);
$('roadNext').onclick=()=>scrollRoadByStep(1);
$('roadJump').onchange=ev=>{const id=ev.target.value;if(!id)return;const t=all.find(x=>x.id===id);if(t){phaseId=t.id;moduleId=null;selectedId=t.id;draw();inspect(t);const el=$('road').querySelector('.milestone.selected');if(el)el.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'})}};
$('refresh').onclick=refresh;let layoutWidth=0;new ResizeObserver(entries=>{const width=entries[0].contentRect.width;if(Math.abs(width-layoutWidth)>1){layoutWidth=width;if(all.length)draw()}}).observe($('graph'));new ResizeObserver(updateRoadButtons).observe($('road'));refresh();setInterval(refresh,15000);
</script></html>
